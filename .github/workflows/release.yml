name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      # README 里「一行装最新 Release」用的是 GitHub 的 latest 永久路径：
      #   .../releases/latest/download/spydercopilotchat-0-py3-none-any.whl
      # 该路径要求文件名逐字固定，而正常产物的名字里带真实版本号，所以每次
      # 发版都额外挂一份固定名副本（同一批字节，仅文件名不同）。版本段写 0
      # 只是让文件名合法，真实版本仍取自 wheel 内的 METADATA。
      - name: 生成固定名副本
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          WHEEL="dist/spydercopilotchat-${VERSION}-py3-none-any.whl"
          test -f "$WHEEL" || { echo "wheel not found: $WHEEL"; ls -l dist; exit 1; }
          cp "$WHEEL" dist/spydercopilotchat-0-py3-none-any.whl
          ls -l dist/*.whl

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

      # 仓库内 latest/ 再留一份固定名副本：给 jsDelivr 这类直接读仓库文件的
      # 加速通道用，也给没有网络时的仓库副本用。注意 CDN 有缓存，README 已把
      # 主推路径换成 Releases 的 latest 直链，这里只作镜像。
      - name: 同步仓库内固定链接
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout -B main origin/main
          mkdir -p latest
          # 精确定位本次 tag 构建出的 wheel，别用 ls | head -1：
          # dist/ 里一旦混入历史版本，按文件名排序会挑到最旧的那个。
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          WHEEL="dist/spydercopilotchat-${VERSION}-py3-none-any.whl"
          test -f "$WHEEL" || { echo "wheel not found: $WHEEL"; ls -l dist; exit 1; }
          cp "$WHEEL" latest/spydercopilotchat-0-py3-none-any.whl
          git add -f latest/spydercopilotchat-0-py3-none-any.whl
          if git diff --cached --quiet; then
            echo "wheel unchanged"
          else
            git commit -m "chore(release): 同步 ${{ github.ref_name }} 的最新 wheel [skip ci]"
            git push origin main
          fi
