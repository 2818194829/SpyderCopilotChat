name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

      # README 里那条「一行装最新版」指向 jsDelivr 的 latest/ 固定路径。
      # 文件名必须保持不变（版本段固定为 0，真实版本在 wheel 的 METADATA 里），
      # 每次发版只覆盖内容，用户不用改命令。
      - name: 同步固定下载链接
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout -B main origin/main
          mkdir -p latest
          # 精确定位本次 tag 构建出的 wheel，别用 ls | head -1：
          # dist/ 里一旦混入历史版本，按文件名排序会挑到最旧的那个。
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          WHEEL="dist/spydercopilotchat-${VERSION}-py3-none-any.whl"
          test -f "$WHEEL" || { echo "wheel not found: $WHEEL"; ls -l dist; exit 1; }
          cp "$WHEEL" latest/spydercopilotchat-0-py3-none-any.whl
          git add -f latest/spydercopilotchat-0-py3-none-any.whl
          if git diff --cached --quiet; then
            echo "wheel unchanged"
          else
            git commit -m "chore(release): 同步 ${{ github.ref_name }} 的最新 wheel [skip ci]"
            git push origin main
          fi
