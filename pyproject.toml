[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SpyderCopilotChat"
version = "0.8.14"
description = "把 GitHub Copilot Chat 搬进 Spyder 6：侧栏对话、Agent 自动改代码、改动直接标成红绿行逐处接受"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Spyder Copilot Chat contributors"}
]
keywords = ["spyder", "copilot", "ai", "agent", "llm", "ide", "diff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "spyder>=6.0",
    "requests>=2.28",
    "qtpy>=2.2",
]

# 数学公式渲染用 matplotlib 的 mathtext 排版引擎（只在用到公式时导入，
# 缺失时自动降级成等宽源码，不影响其他功能）
[project.optional-dependencies]
math = ["matplotlib>=3.4"]

[project.urls]
Homepage = "https://github.com/2818194829/SpyderCopilotChat"
Repository = "https://github.com/2818194829/SpyderCopilotChat"
Issues = "https://github.com/2818194829/SpyderCopilotChat/issues"

[project.entry-points."spyder.plugins"]
copilot_chat = "spyder_copilot_chat.plugin:CopilotChatPlugin"

[project.entry-points."spyder.completions"]
copilot_fim_provider = "spyder_copilot_chat.fim.provider:CopilotFimProvider"

[tool.setuptools.packages.find]
where = ["."]
include = ["spyder_copilot_chat*"]

# 内置 Prompt 模板与 Skills 是运行时资源（不是 .py），必须显式打包；
# 否则安装到 user site 后 list_skills() 只能看到用户级 / 项目级技能。
[tool.setuptools.package-data]
"spyder_copilot_chat.prompts" = ["*.prompt.md", "skills/*/SKILL.md"]
